[package]
name = "personal-erp-desktop"
version = "0.1.0"
description = "Personal ERP · 桌面壳"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "personal_erp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
